[program:revisionhub-ai-document-processing]
process_name=%(program_name)s_%(process_num)02d
directory=/var/www/revisionhub
command=/usr/bin/php artisan queue:work --queue=ai-processing,default --sleep=1 --tries=3 --timeout=180
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=1
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/supervisor/revisionhub-ai-document-processing.log
stopwaitsecs=180
