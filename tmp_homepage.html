        border-color: #fff;
        background: #fff;
    }

        content: "";
        position: absolute;
        inset: 3px;
        border-radius: 50%;

            <script>
        "use strict";

        document.addEventListener('DOMContentLoaded', function() {
            const topicStrip = document.querySelector('[data-topic-strip]');
            if (!topicStrip) {
                return;
            }

            const list = topicStrip.querySelector('[data-topic-strip-list]');
            const apiUrl = topicStrip.dataset.apiUrl;
            const baseUrl = topicStrip.dataset.baseUrl;
            const currentMainCategory = topicStrip.dataset.currentMainCategory;

            const renderCategories = (categories) => {
                if (!Array.isArray(categories) || categories.length === 0) {
                    topicStrip.classList.add('is-hidden');
                    return;
                }

                list.innerHTML = '';

                categories.forEach((category) => {
                    if (!category.slug || !category.name) {
                        return;
                    }

                    const link = document.createElement('a');
                    const url = new URL(baseUrl, window.location.origin);
                    url.searchParams.set('main_category', category.slug);

                    link.href = url.toString();
                    link.className = 'course-chip-strip__chip';
                    if (currentMainCategory === category.slug) {
                        link.classList.add('active');
                    }
                    link.textContent = category.name;
                    list.appendChild(link);
                });

                if (!list.children.length) {
                    topicStrip.classList.add('is-hidden');
                }
            };

            fetch(apiUrl, {
                    headers: {
                        'Accept': 'application/json'
                    }
                })
                .then((response) => {
                    if (!response.ok) {
                        throw new Error('Failed to load categories');
                    }
                    return response.json();
                })
                .then((payload) => {
                    renderCategories(payload.data || []);
                })
                .catch(() => {
                    topicStrip.classList.add('is-hidden');
                });
        });
    </script>
