name: Deploy to Hostinger

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          port: ${{ secrets.PORT }}
          password: ${{ secrets.PASSWORD }}
          script: |
            set -e
            CORE_PATH="/home/u518207442/domains/revisionhubkenya.com/pastpapers_app"
            PUBLIC_PATH="/home/u518207442/domains/revisionhubkenya.com/public_html"

            echo "=== Starting deploy ==="

            if [ ! -d "$CORE_PATH/.git" ]; then
              echo "Cloning fresh..."
              rm -rf $CORE_PATH
              cd /home/u518207442/domains/revisionhubkenya.com/
              git clone https://github.com/revisionkenya254-lgtm/revisionhublaravel.git pastpapers_app
            fi

            cd $CORE_PATH
            echo "Pulling latest..."
            git pull origin main

            echo "Installing composer..."
            composer install --no-dev --optimize-autoloader --no-interaction

            php artisan migrate --force || true
            php artisan storage:link || true
            php artisan config:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            chmod -R 775 storage bootstrap/cache

            echo "Copying public to public_html..."
            rsync -av public/ $PUBLIC_PATH/ --delete

            echo "Fixing index.php paths..."
            sed -i "s|__DIR__.'/../vendor|__DIR__.'/../pastpapers_app/vendor|g" $PUBLIC_PATH/index.php
            sed -i "s|__DIR__.'/../bootstrap|__DIR__.'/../pastpapers_app/bootstrap|g" $PUBLIC_PATH/index.php

            echo "=== DONE ==="