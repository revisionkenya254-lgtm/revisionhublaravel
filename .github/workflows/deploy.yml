name: Deploy to CloudPanel

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          port: ${{ secrets.PORT }}
          password: ${{ secrets.PASSWORD }}
          script: |
            cd /home/revisionhubkenya/htdocs/www.revisionhubkenya.com

            echo "Pulling latest..."
            git pull origin main

            composer install --no-dev --optimize-autoloader --no-interaction

            php artisan migrate --force || true
            php artisan storage:link || true

            php artisan config:clear
            php artisan route:clear
            php artisan view:clear
            php artisan config:cache
            php artisan route:cache

            chmod -R 775 storage bootstrap/cache

            # Make sure no fake index.html exists - DELETE IT FROM REPO SOURCE
            rm -f index.html
            rm -f public/index.html
            rm -f public/index.html.bak || true
            
            # Restore REAL Laravel index.php if it got overwritten
            git checkout HEAD -- public/index.php || true

            # Restart PHP
            systemctl restart php8.2-fpm || clpctl system:restart --service=php-fpm || true

            echo "SUCCESS: revisionhubkenya.com deployed on CloudPanel"