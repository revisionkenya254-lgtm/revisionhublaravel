name: Deploy to CloudPanel

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          port: ${{ secrets.PORT }}
          key: ${{ secrets.KEY }}
          script: |
            cd /home/revisionhubkenya/htdocs/www.revisionhubkenya.com
            echo "Pulling latest.."
            
            # Force clean update - fixes the Oct 14 stuck date issue
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            
            # Remove CloudPanel dummy file
            rm -f index.html public/index.html public/index.html.bak
            
            composer install --no-dev --optimize-autoloader --no-interaction
            
            php artisan migrate --force || true
            php artisan storage:link || true
            
            # Clear all caches
            php artisan cache:clear
            php artisan config:clear
            php artisan route:clear
            php artisan view:clear
            
            php artisan optimize
            
            chmod -R 775 storage bootstrap/cache
            
            # Varnish purge if enabled
            rm -rf .varnish-cache/* || true
            rm -rf storage/framework/cache/* || true
            rm -rf storage/framework/views/* || true
            
            echo "SUCCESS - Deployed $(git rev-parse --short HEAD)"